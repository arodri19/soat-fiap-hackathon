# golangci-lint v2
version: "2"
linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - nilerr
    - revive
  settings:
    gosec:
      excludes:
        - G204   # exec do ffmpeg com argumentos controlados (caminhos gerados pelo próprio worker)
        - G304   # arquivos abertos estão no diretório temporário criado pelo próprio worker
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
formatters:
  enable: [gofmt, goimports]
