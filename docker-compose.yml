# FIAP X — ambiente local
#
#   make up        sobe a infraestrutura
#   make down      derruba (mantém os dados)
#   make clean     derruba e apaga os volumes
#
# Os serviços da aplicação (auth, video-api, processor, notification, frontend)
# entram neste arquivo conforme forem implementados.

name: fiapx

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 20

services:
  # ---------------------------------------------------------------- dados
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      VIDEO_DB_NAME: ${VIDEO_DB_NAME:-video_db}
      VIDEO_DB_USER: ${VIDEO_DB_USER:-video_user}
      VIDEO_DB_PASSWORD: ${VIDEO_DB_PASSWORD:-video_pass}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq          # nome fixo do nó: mantém as mensagens entre reinícios
    ports:
      - "5672:5672"             # AMQP
      - "15672:15672"           # painel de administração
      - "15692:15692"           # métricas Prometheus
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-fiapx.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]

  # MinIO deixou de publicar imagens públicas em 2025; esta é a última versão com
  # console completo, mantida congelada pela Bitnami. Os serviços falam S3 puro
  # (AWS SDK), então trocar por SeaweedFS/RustFS/S3 real é só configuração.
  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      # Sem isso, a imagem Bitnami sobe o MinIO, para e sobe de novo no boot, e as
      # conexões feitas logo após o healthcheck caem ("socket hang up").
      MINIO_SKIP_CLIENT: "yes"
    ports:
      - "9000:9000"             # API S3
      - "9001:9001"             # console
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]

  minio-init:
    image: bitnamilegacy/minio:2025.4.22     # reaproveita o cliente mc da mesma imagem
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-raw-videos}
      MINIO_BUCKET_ZIP: ${MINIO_BUCKET_ZIP:-frame-zips}
      MC_CONFIG_DIR: /tmp/.mc
    volumes:
      - ./infra/minio/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: ["/bin/sh", "/create-buckets.sh"]
    restart: "no"

  # ---------------------------------------------------------------- e-mail
  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "1025:1025"             # SMTP
      - "8025:8025"             # caixa de entrada web

  # ---------------------------------------------------------------- aplicação
  auth:
    build: ./services/auth
    image: fiapx-auth:local
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${AUTH_DB_USER:-auth_user}:${AUTH_DB_PASSWORD:-auth_pass}@postgres:5432/${AUTH_DB_NAME:-auth_db}?schema=public
      REDIS_URL: redis://redis:6379/0
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      COOKIE_SECURE: "false"          # ambiente local sem HTTPS
      COOKIE_PATH: /api/auth
      LOG_LEVEL: info
    secrets: [jwt_private_key]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["3001:3001"]              # acesso direto só para desenvolvimento; o normal é via gateway

  video-api:
    build: ./services/video-api
    image: fiapx-video-api:local
    environment:
      NODE_ENV: production
      PORT: "3002"
      DATABASE_URL: postgresql://${VIDEO_DB_USER:-video_user}:${VIDEO_DB_PASSWORD:-video_pass}@postgres:5432/${VIDEO_DB_NAME:-video_db}
      RABBITMQ_URL: amqp://fiapx:fiapx@rabbitmq:5672
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000   # URLs de download abertas pelo navegador
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_RAW: ${MINIO_BUCKET_RAW:-raw-videos}
      S3_BUCKET_ZIP: ${MINIO_BUCKET_ZIP:-frame-zips}
      JWKS_URL: http://auth:3001/.well-known/jwks.json
      MAX_UPLOAD_MB: "500"
      LOG_LEVEL: info
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      auth: { condition: service_healthy }
    ports: ["3002:3002"]              # acesso direto só para desenvolvimento; o normal é via gateway

  notification:
    build: ./services/notification
    image: fiapx-notification:local
    environment:
      NODE_ENV: production
      PORT: "3003"
      RABBITMQ_URL: amqp://fiapx:fiapx@rabbitmq:5672
      REDIS_URL: redis://redis:6379/1        # database 1: separado do rate limit do auth
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      APP_URL: http://localhost:${GATEWAY_PORT:-8080}
      LOG_LEVEL: info
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }

  # Worker: escala horizontalmente (make scale n=3). Sem porta no host; métricas em :9101
  # descobertas pelo Prometheus via DNS do compose.
  processor:
    build: ./services/processor
    image: fiapx-processor:local
    restart: unless-stopped           # sai com erro se perder o RabbitMQ; o compose reinicia
    stop_grace_period: 2m             # termina o vídeo em andamento antes de parar
    environment:
      RABBITMQ_URL: amqp://fiapx:fiapx@rabbitmq:5672
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_RAW: ${MINIO_BUCKET_RAW:-raw-videos}
      S3_BUCKET_ZIP: ${MINIO_BUCKET_ZIP:-frame-zips}
      WORKER_CONCURRENCY: "2"         # vídeos em paralelo por réplica
      MAX_ATTEMPTS: "3"
      JOB_TIMEOUT: 10m
      LOG_LEVEL: info
    depends_on:
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }

  frontend:
    build: ./frontend
    image: fiapx-frontend:local
    environment:
      API_BASE_URL: /api                       # mesma origem via gateway (cookie de refresh funciona)
      GRAFANA_URL: http://localhost:3000
      PROMETHEUS_URL: http://localhost:9090
      RABBITMQ_URL: http://localhost:15672
      MAILPIT_URL: http://localhost:8025
      MINIO_URL: http://localhost:9001

  # ---------------------------------------------------------------- entrada
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]

  # ---------------------------------------------------------------- observabilidade
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports: ["9090:9090"]
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.3.1
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

# Chave RS256 do JWT (gerada por `make keys`, fora do git)
secrets:
  jwt_private_key:
    file: ./infra/secrets/jwt-private.pem

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  grafana-data:
