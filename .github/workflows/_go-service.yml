# CI reutilizável para o serviço em Go (processor-worker).
name: _go-service

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      path:
        required: true
        type: string
      coverage-threshold:
        description: Cobertura mínima (%) do pacote internal/usecase
        required: false
        type: number
        default: 80

permissions:
  contents: read

jobs:
  ci:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Verifica se o projeto já existe
        id: check
        working-directory: .   # roda na raiz: a pasta do projeto pode ainda não existir
        run: |
          if [ -f "${{ inputs.path }}/go.mod" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=${{ inputs.name }}::Sem go.mod em ${{ inputs.path }} ainda; CI ignorado."
          fi

      - uses: actions/setup-go@v5
        if: steps.check.outputs.exists == 'true'
        with:
          go-version-file: ${{ inputs.path }}/go.mod
          cache-dependency-path: ${{ inputs.path }}/go.sum

      - name: Lint (golangci-lint v2)
        if: steps.check.outputs.exists == 'true'
        run: |
          docker run --rm -v "$PWD:/app" -w /app \
            golangci/golangci-lint:v2.15.0 golangci-lint run --timeout 5m ./...

      - name: Instala ffmpeg (testes de integração)
        if: steps.check.outputs.exists == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Testes + cobertura
        if: steps.check.outputs.exists == 'true'
        # inclui o teste E2E (test/), que sobe RabbitMQ e MinIO com Testcontainers
        run: go test -race -covermode=atomic -coverprofile=coverage.out -timeout 10m ./...

      - name: Gate de cobertura (internal/usecase)
        if: steps.check.outputs.exists == 'true'
        run: |
          pct=$(go test -cover ./internal/usecase/... | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          echo "Cobertura de internal/usecase: ${pct:-0}%"
          awk -v p="${pct:-0}" -v t="${{ inputs.coverage-threshold }}" 'BEGIN { exit (p+0 < t+0) }' \
            || { echo "::error::Cobertura ${pct:-0}% abaixo de ${{ inputs.coverage-threshold }}%"; exit 1; }

      - name: Vulnerabilidades (govulncheck)
        if: steps.check.outputs.exists == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Publica relatório de cobertura
        if: always() && steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.name }}
          path: ${{ inputs.path }}/coverage.out
          if-no-files-found: ignore
          retention-days: 7

      - name: Build da imagem Docker (validação)
        if: steps.check.outputs.exists == 'true' && hashFiles(format('{0}/Dockerfile', inputs.path)) != ''
        run: docker build -t "fiapx-${{ inputs.name }}:ci" .
