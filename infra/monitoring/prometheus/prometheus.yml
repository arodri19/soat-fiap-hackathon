global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Plugin rabbitmq_prometheus: tamanho das filas, mensagens publicadas/entregues, consumidores
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Serviços da aplicação (aparecem como DOWN até serem implementados)
  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:3001"]
        labels: { service: auth }

  - job_name: video-api
    metrics_path: /metrics
    static_configs:
      - targets: ["video-api:3002"]
        labels: { service: video-api }

  - job_name: notification
    metrics_path: /metrics
    static_configs:
      - targets: ["notification:3003"]
        labels: { service: notification }

  - job_name: processor
    metrics_path: /metrics
    dns_sd_configs:            # descobre todas as réplicas do worker (docker compose --scale)
      - names: ["processor"]
        type: A
        port: 9101
