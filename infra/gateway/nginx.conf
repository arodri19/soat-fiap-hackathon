# Gateway: ponto único de entrada (mesma origem para o frontend → sem CORS e
# o cookie de refresh token funciona com SameSite=Strict).
#
#   /api/auth/*    -> auth-service   (/auth/*)
#   /api/videos*   -> video-api      (/videos*)
#   /*             -> frontend
#
# Os upstreams são resolvidos em tempo de requisição (resolver do Docker), então o
# gateway sobe mesmo antes dos serviços existirem; nesse caso responde 502.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format gateway escape=json
  '{"time":"$time_iso8601","request_id":"$req_id","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"upstream":"$upstream_addr",'
  '"duration":$request_time,"bytes":$body_bytes_sent}';

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout gateway;

    # Uploads de vídeo: repassa em streaming, sem bufferizar em disco no gateway
    client_max_body_size 600m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $req_id;
    add_header X-Request-Id $req_id always;

    set $auth_upstream     auth:3001;
    set $video_upstream    video-api:3002;
    set $frontend_upstream frontend:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/auth/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$auth_upstream;
    }

    location ^~ /api/videos {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$video_upstream;
    }

    # Endpoints internos (JWKS, métricas) não são expostos pelo gateway
    location ~ ^/api/ {
        default_type application/json;
        return 404 '{"error":"Rota não encontrada"}';
    }

    location / {
        proxy_pass http://$frontend_upstream;
    }

    error_page 502 503 504 = @unavailable;
    location @unavailable {
        default_type application/json;
        return 503 '{"error":"Serviço indisponível"}';
    }
}
